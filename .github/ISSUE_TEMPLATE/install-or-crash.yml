name: Install problem or crash
description: exactdoc would not install, or stopped with an error you did not expect.
title: "Install/crash: "
labels: ["install-or-crash"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing exactdoc. Use this form when `pip install` fails,
        when `exactdoc` will not start, or when a conversion stops with a
        traceback or "This is a bug". If the conversion finished but the DOCX
        looks wrong, use the **Bad conversion** form instead.

        > [!WARNING]
        > **Do not attach a confidential PDF.** Everything in this issue is
        > public, for ever. Error messages name files, not their folders, but
        > read what you paste and remove anything private.

  - type: input
    id: version
    attributes:
      label: exactdoc version
      description: The output of `exactdoc --version`, or "did not install".
      placeholder: exactdoc 0.3.0b1
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other (say which below)
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: The output of `python --version`.
      placeholder: Python 3.12.9
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: How did you install it?
      options:
        - pip install exactdoc
        - pipx install exactdoc
        - uv / uvx
        - From a copy of the repository (pip install .)
        - Other (say which below)
    validations:
      required: true

  - type: input
    id: libreoffice
    attributes:
      label: LibreOffice
      description: >-
        Its version if it is installed (`soffice --version`), or "not
        installed". exactdoc works without it.
      placeholder: not installed
    validations:
      required: false

  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: The full command line, or the Python call.
      render: text
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Everything it printed
      description: >-
        The complete output, including any traceback, from the command to
        the end. If it was a conversion, add its exit code (`echo $?` on
        macOS or Linux, `echo $LASTEXITCODE` in PowerShell).
      render: text
    validations:
      required: true

  - type: textarea
    id: diagnose
    attributes:
      label: Output of `exactdoc --diagnose your.pdf` (if a PDF was involved)
      description: >-
        No text from the document is included, but the program that made the
        PDF and its font names are. Read it through first.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Nothing I pasted or attached here is confidential.
          required: true
