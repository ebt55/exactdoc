# The fidelity gate, run STRICT inside the pinned canonical measurement image.
#
# Determinism has two halves and this workflow needs both:
#
#   inputs       16 PDFs frozen in testkit/fixtures/, pinned by SHA-256. They
#                used to be regenerated here, so a Chromium update on the runner
#                silently changed a corpus document and moved a gated metric 5x.
#   environment  the renderer decides the numbers. `evidence.environment()`
#                fingerprints the OS, the exact Python, the LibreOffice build,
#                scripts/fonts.conf, every visible font file and every
#                measurement dependency, and `canonical` means exactly the
#                combination recorded in testkit/canonical_env.json.
#
# So the job runs in a container, not on the runner. The image is the
# maintainer's canonical snapshot `exactdoc-gate:boot` (docker/gate.Dockerfile,
# the Carlito layer and a bootstrapped /work/.venv), flattened with its old
# working tree removed by scripts/dev/ci_image.sh, pushed to
# ghcr.io/ebt55/exactdoc-gate and pinned below by digest. It is NOT rebuilt,
# because a rebuild resolves today's apt and is a new environment; flattening
# changes no file the fingerprint reads. Inside it the run
# reproduces fingerprint 9cb0bc17, the environment testkit/gate_baseline.json
# was recorded in, so the baseline binding (testkit/gate.py, WP43) holds and
# the gate is strict: no stale-baseline allowance is ever set here. A bare
# ubuntu-24.04 runner cannot reproduce it (its Python, LibreOffice and font
# set differ), which is why this job stopped running on one. A new digest is a
# new environment and a baseline migration (gate-image.yml, scripts/dev/README.md).
#
# Fingerprint inputs set below, each checked against canonical_env.json:
# EXACTDOC_BASE_IMAGE_DIGEST is the ubuntu:24.04 digest the image was built
# FROM (recorded as image.base_digest); EXACTDOC_GATE_IMAGE_DIGEST is recorded
# as null and must stay unset; FONTCONFIG_FILE restricts the renderer to the
# pinned font set. EXACTDOC_GATE_IMAGE and EXACTDOC_GATE_IMAGE_ID are
# provenance only. The tree is copied to /work, where the image's venv expects
# it; `uv sync --frozen` there re-installs only exactdoc itself.
#
# Two lanes (testkit/runall.py): `raw` is the open-loop control and `product` is
# exactdoc.options.PRODUCT -- the PDFium/standard/LibreOffice profile the API
# and CLI ship. Their profile IDs are distinct and **both** lanes gate the exit
# code.
#
# Every step here is fail-closed. That is the whole design: a green check must
# mean that all 16 manifest documents existed, the renderer answered, every
# required metric was computed, nothing regressed past its recorded number, and
# the backend policy still describes reality. It previously could mean none of
# those things -- see the docstrings in testkit/gate.py for the list, each entry
# of which is now a test in tests/test_gate_mutations.py.
#
# The same image is what `scripts/dev/quality_check.sh --image <this digest>`
# measures in, so a contributor's local verdict and this one agree.
#
# The dependency versions come from uv.lock (--frozen). Backend-namespaced
# goldens record the selected parser package version. The flat golden directory
# is PyMuPDF's, preserved at the path it was written to; PDFium has its own
# namespace. That layout predates the parser flip and was left alone
# deliberately -- moving a golden is a way to lose the ability to compare
# against it.
name: gate

on:
  push:
    # The integration branch too, so the gate is green before main is
    # fast-forwarded to it.
    branches: [main, claude/exactdoc-pdf-docx-tool-d4bf20]
  pull_request:
  # Manual trigger: Actions outages drop push events and never backfill them,
  # which stranded two green-ready commits with no way to summon the gate.
  workflow_dispatch:

permissions:
  contents: read
  packages: read          # pull the pinned image if the package is not public

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # exactdoc-gate:ci = scripts/dev/ci_image.sh on exactdoc-gate:boot (bab1cfc0d2cd).
      image: ghcr.io/ebt55/exactdoc-gate@sha256:PENDING
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      FONTCONFIG_FILE: /work/scripts/fonts.conf
      EXACTDOC_BASE_IMAGE_DIGEST: sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
      EXACTDOC_GATE_IMAGE: ghcr.io/ebt55/exactdoc-gate
      EXACTDOC_GATE_IMAGE_ID: sha256:e10381f24ec0ad789d445a16e0ca7e2a706d3822787df00ef628dea413abdad1
      EXACTDOC_GATE_IMAGE_REF: ghcr.io/ebt55/exactdoc-gate@sha256:PENDING
      # The container's /work holds no .git (see the copy step), so the
      # commit is passed in, as scripts/dev/gate_full.sh does.
      EXACTDOC_GIT_COMMIT: ${{ github.sha }}
      EXACTDOC_GIT_DIRTY: "0"
      EXACTDOC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      # The image's Python, never a downloaded one: the fingerprint pins 3.12.3.
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
      - uses: actions/checkout@v4

      # The image's venv lives at /work/.venv and was installed against /work.
      # Everything else in /work is replaced by this commit's tree; .git is
      # left behind (the commit is in EXACTDOC_GIT_COMMIT).
      - name: Put this commit's tree in /work, keeping the image's venv
        working-directory: /
        run: |
          find /work -mindepth 1 -maxdepth 1 ! -name .venv -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE"/. /work/
          rm -rf /work/.git

      # Measured in the image on 96ede05: uv.lock and the venv agree on every
      # dependency, so this re-installs only exactdoc itself (editable, the
      # current version) and the fingerprint is unchanged.
      - name: Sync the venv with uv.lock (--frozen)
        run: uv sync --frozen --extra test --extra mupdf

      # Fail in seconds, not after the gate: is this the recorded environment?
      - name: The environment is the canonical one (testkit/canonical_env.json)
        run: |
          uv run python - <<'EOF'
          import sys
          sys.path.insert(0, "testkit")
          import evidence
          env = evidence.environment()
          print("fingerprint", env["fingerprint"])
          for m in env["canonical_mismatches"]:
              print("  MISMATCH", m)
          sys.exit(0 if env["canonical"] else 1)
          EOF

      # The renderer sees only the pinned font set (FONTCONFIG_FILE above). A
      # runner image ships a large font collection; with the corpus already
      # frozen byte-for-byte, that alone once moved c4_i18n's dy_p50 from
      # 0.15pt to 2.1pt, because LibreOffice resolved its CJK and RTL runs to
      # faces the measurement environment does not have. See scripts/fonts.conf.
      - name: Pin the font environment
        run: |
          mkdir -p /tmp/exactdoc-fontconfig
          fc-list : family | tr ',' '\n' | sort -u


      # The metric corpus is 16 PDFs frozen in testkit/fixtures/ and pinned by
      # SHA-256. It is NOT regenerated here, and that is the fix for the failure
      # this workflow actually had: the baseline was recorded against a corpus
      # built with Chromium 149, this runner ships Chromium 150, `c4_i18n` came
      # out a different document, and its vertical drift moved 0.15pt -> 0.7pt.
      # A gated metric moved 5x because of a browser update. A generated corpus
      # cannot be a measurement baseline.
      - name: Corpus fixtures - byte-identical to the record?
        run: uv run python testkit/corpus_manifest.py verify

      # The generators still run, and no longer gate a measured number. Drift
      # between a fresh generation and the frozen bytes is reported: it says the
      # toolchain moved, which is worth knowing and is not a regression here.
      - name: Corpus generators still work (drift reported, not gated)
        run: uv run python tests/test_corpus_generation.py

      # DISCOVERY, because a named list goes stale silently. This step ran five
      # files by name while the suite grew to 663 tests, so roughly 200 of them
      # had never run in CI -- the same blindness the parser-flip audit found,
      # where Linux-only probe-test failures were invisible because nothing here
      # named those files. A list of files is a claim about what matters, and it
      # is wrong the moment somebody adds a test.
      - name: Unit tests - full discovery
        run: uv run python -m unittest discover -s tests

      # These five are NOT redundant with the step above and must not be folded
      # into it. They are scripts -- module-level `test_*` functions and a
      # `check()` collector, not `unittest.TestCase` subclasses -- and unittest's
      # loader collects only TestCase subclasses. Measured, each one:
      # `python -m unittest tests.test_gate_mutations` reports "Ran 0 tests", and
      # the same for the other four. Replacing them with discovery would have
      # silently deleted every gate-mutation check, including the byte-pin/LF
      # guard, while the step above went green. Their exit codes are the assertion.
      - name: Unit tests - the script-style suites discovery cannot see
        run: |
          uv run python tests/test_purity.py
          uv run python tests/test_corpus_degradation.py
          uv run python tests/test_gate_mutations.py
          uv run python tests/test_golden_ir_backend.py
          uv run python tests/test_bottom_margin_relief.py

      # Isolation: make `fitz` unimportable and convert representative fixtures
      # through the SHIPPING profile. This runner installs the `mupdf` extra
      # because it is the measurement machine, so without this step nothing here
      # would notice a new top-level `import fitz` -- and a user's install, which
      # has no AGPL package at all, would be the first to find out.
      #
      # Isolation is not installability: the base-wheel proof is
      # docs/evidence/base-wheel-proof-2026-08-06.json.
      - name: Convert with the shipping profile and PyMuPDF blocked
        run: uv run python tests/test_no_pymupdf.py

      - name: Golden IR - the parser's output must not drift
        run: |
          uv run python testkit/golden_ir.py verify
          uv run python testkit/golden_ir.py verify --backend pdfium

      - name: Fidelity gate, both lanes, fail closed
        run: uv run python testkit/runall.py

      # Measurement-only, and still non-blocking after the flip. `--measure` is
      # read-only and unadjudicated by construction, so its exit code is
      # deliberately not a verdict; the gate's verdict is the step above, and the
      # ratified parity record is docs/evidence/parity-expanded-2026-08-05f.json.
      # What this step is for now is DRIFT: the two arms are still both installed
      # here, so a change that moves them apart shows up as a diff rather than as
      # a surprise on the next migration-scale decision.
      - name: Backend parity - reference-arm measurement
        continue-on-error: true
        run: uv run python testkit/backend_parity.py --profile candidate --measure

      - name: Evidence - one artifact every published number traces to
        if: always()
        run: uv run python testkit/evidence.py --out testkit/batch/evidence.json

      - name: Upload lane results and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: |
            /work/testkit/batch/evidence.json
            /work/testkit/batch/provenance.json
            /work/testkit/batch/lane_product/results.json
            /work/testkit/batch/lane_product/verdict.json
            /work/testkit/batch/lane_raw/results.json
            /work/testkit/batch/lane_raw/verdict.json
          if-no-files-found: error
