[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exactdoc"
version = "0.3.0b3"
description = "Turn PDFs into editable Word documents that look like the original, checked page by page in Word, LibreOffice and Google Docs"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ebin Babu Thomas" }]
keywords = [
    "pdf", "docx", "pdf-to-docx", "pdf-to-word", "google-docs",
    "document-conversion", "ooxml", "layout-analysis", "pdfium",
    "whitepaper", "research-paper",
]
# No `License ::` classifier: the SPDX `license` field above replaces it
# (PEP 639), and setuptools >= 77 warns that builds carrying both stop working
# after 2027-02-18. The Python versions are the ones .github/workflows/install.yml
# installs the wheel on and converts with; the operating systems are its matrix.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pypdfium2>=4.25",
    "python-docx>=1.1",
    "numpy>=1.24",
    "pillow>=10.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
# Test harness: adversarial corpus generation + measurement.
test = ["reportlab>=4.0", "fpdf2>=2.7"]
# The PyMuPDF parser, and the base-14 text metrics the quality ladder shapes
# with. **PyMuPDF is AGPL-3.0-or-later; installing this extra changes your
# obligations for anything you distribute.** Nothing in a default install
# imports it: `backend="pymupdf"` and `--ladder` are the only doors, and both
# say so by name when the extra is absent. See docs/license-audit.md.
mupdf = ["pymupdf>=1.23"]
# Google Docs oracle -- measure fidelity in the renderer actually targeted.
gdocs = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=1.1",
]

# Documentation and Changelog point at `main`, as the CLI's --help does
# (cli.USAGE_URL). They resolve once main carries the release commit, which
# docs/releasing.md makes a step of every release.
[project.urls]
Homepage = "https://github.com/ebt55/exactdoc"
Documentation = "https://github.com/ebt55/exactdoc/blob/main/docs/usage.md"
Changelog = "https://github.com/ebt55/exactdoc/blob/main/CHANGELOG.md"
Source = "https://github.com/ebt55/exactdoc"
Issues = "https://github.com/ebt55/exactdoc/issues"

[project.scripts]
exactdoc = "exactdoc.cli:main"
exactdoc-gdocs = "exactdoc.gdocs:main"

[tool.setuptools]
packages = ["exactdoc"]
