[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exactdoc"
version = "0.1.0a1"
description = "High-fidelity PDF to DOCX that survives Google Docs, with a render-back diff that proves it"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Ebin Babu Thomas" }]
keywords = [
    "pdf", "docx", "pdf-to-docx", "pdf-to-word", "google-docs",
    "document-conversion", "ooxml", "layout-analysis", "pymupdf",
    "whitepaper", "research-paper",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pymupdf>=1.23",
    "python-docx>=1.1",
    "numpy>=1.24",
    "pillow>=10.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
# Test harness: adversarial corpus generation + measurement.
test = ["reportlab>=4.0", "fpdf2>=2.7"]
# The experimental permissive backend (exactdoc/parse_pdfium.py). Not a runtime
# dependency -- pymupdf is still the default parser -- but the backend and its
# parity gate are unrunnable without it, and an undeclared import is one
# `uv sync` away from vanishing. It did: the gate started reporting
# ModuleNotFoundError instead of regressions.
pdfium = ["pypdfium2>=4.25"]
# Google Docs oracle -- measure fidelity in the renderer actually targeted.
gdocs = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=1.1",
]

[project.urls]
Homepage = "https://github.com/ebt55/exactdoc"
Issues = "https://github.com/ebt55/exactdoc/issues"

[project.scripts]
exactdoc = "exactdoc.cli:main"

[tool.setuptools]
packages = ["exactdoc"]
