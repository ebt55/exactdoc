<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The pinned font environment for the fidelity gate.

  The renderer's font set decides the numbers, and it is not enough to install
  the right fonts: what matters is that no OTHERS are visible. Measured, and it
  cost two red CI runs after the corpus was already frozen byte-for-byte:

    c4_i18n (CJK + Arabic + Hebrew)   dy_p50 0.15pt -> 2.1pt
                                      within2pt 0.416 -> 0.038

  Same input bytes, same LibreOffice build, same Python. The difference was that
  a GitHub runner image ships a large font collection, so LibreOffice resolved
  the CJK and RTL runs to different faces than the 59-font measurement container
  did. Liberation covers Latin only; it says nothing about the scripts that
  document is made of.

  So this file replaces fontconfig's search path entirely rather than adding to
  it. Point FONTCONFIG_FILE at it and the renderer sees exactly these families,
  wherever it runs:

    Liberation   metric-compatible with Arial / Times New Roman / Courier New
    DejaVu       Latin fallback, and the Hebrew coverage
    FreeFont     Arabic
    WenQuanYi    Simplified Chinese
    IPA Gothic   Japanese
    Carlito      metric-compatible with Calibri   (added 2026-10-06, WP31)
    Caladea      metric-compatible with Cambria   (added 2026-10-06, WP31)

  Adding a font here changes every measured number on any document that uses the
  script it covers. That is a baseline re-record, not a tidy-up.

  Carlito and Caladea were exactly that: the owner approved them on 2026-10-06.
  The standard profile writes Calibri and Cambria by name (exactdoc/fonts.py),
  and with neither clone visible LibreOffice drew both in FreeSerif: a serif
  at the wrong widths, so a Calibri document re-wrapped in the measurement in a
  way no reader with Calibri or Carlito ever sees. (No double hyphens in this
  comment: XML forbids them, and fontconfig then rejects the whole file.) docs/evidence/
  carlito-2026-10-06.json is the before/after; the crosextra directory simply
  does not exist in an image built before that date, so this file renders
  identically there and only its digest (part of the environment fingerprint)
  differs.
-->
<fontconfig>
  <!-- Only these directories. Deliberately not <dir>/usr/share/fonts</dir> in
       general: on a stock runner that pulls in Noto, Ubuntu, MS core fonts and
       whatever else the image happens to carry. -->
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/freefont</dir>
  <dir>/usr/share/fonts/truetype/wqy</dir>
  <dir>/usr/share/fonts/opentype/ipafont-gothic</dir>
  <dir>/usr/share/fonts/truetype/fonts-japanese-gothic.ttf</dir>
  <dir>/usr/share/fonts/truetype/crosextra</dir>

  <!-- A writable cache the runner and the container can both use. -->
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>/tmp/exactdoc-fontconfig</cachedir>

  <!-- The metric-compatible substitutions the writer's font mapping assumes
       (exactdoc/fonts.py maps Helvetica->Arial, Times->Times New Roman,
       Courier->Courier New). Without these, a DOCX asking for Arial on a machine
       with no Arial gets whatever fontconfig prefers, which is not necessarily
       metric-compatible and silently changes every line break. -->
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Mono</string></edit>
  </match>
  <!-- The Office pair, the same way. Only the two exact metric clones: "Calibri
       Light" and other Office families have no metric-compatible face here, and
       mapping them onto Carlito would be a guess dressed as a substitution. -->
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="same"><string>Caladea</string></edit>
  </match>

  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family><family>WenQuanYi Zen Hei</family><family>FreeSans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>DejaVu Serif</family><family>FreeSerif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family><family>FreeMono</family></prefer></alias>
</fontconfig>
